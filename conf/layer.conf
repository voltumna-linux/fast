# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "fast"
BBFILE_PATTERN_fast = "^${LAYERDIR}/"
# Higher than meta-voltumna (20): our bbappends (systemd, grub-bootconf,
# procps, pam...) must win over the base distro ones.
BBFILE_PRIORITY_fast = "22"

LAYERSERIES_COMPAT_fast = "whinlatter wrynose"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_fast = "1"

LAYERDEPENDS_fast = "core meta-voltumna intel amd-bsp elettra"
