serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
default=hybridboot
timeout=2

menuentry 'hybridboot' {
	set image=@IMAGE_NAME@
	linux ($root)/$image/boot/bzImage norandmaps mitigations=off systemd.gpt_auto=off console=ttyS0,115200n8 console=tty0 rootfstype=tmpfs ip=:::::@ETH@:dhcp::: mount.usr=/voltumna/$image quiet pti=off isolcpus=3,7 nohz_full=3,7 rcu_nocbs=3,7 irqaffinity=0-2,4-6 intel_idle.max_cstate=0 processor.max_cstate=0 idle=poll nosoftlockup nmi_watchdog=0 nowatchdog default_hugepagesz=1G hugepagesz=1G hugepages=1 mce=off numa_balancing=disable iommu=pt
	initrd ($root)/$image/boot/microcode.cpio
}

