serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
default=hybridboot
timeout=2

menuentry 'hybridboot' {
	set image=$net_default_ip/@IMAGE_NAME@
	linux ($root)/$image/boot/bzImage norandmaps mitigations=off systemd.gpt_auto=off console=ttyS0,115200n8 console=tty0 rootfstype=tmpfs ip=:::::@ETH@:dhcp::: quiet pti=off isolcpus=domain,nohz,managed_irq,pcpu,stack,lru,pcp,cputime,psi,node,asid,tlbbatch,128-255,384-511 nohz_full=128-255,384-511 rcu_nocbs=128-255,384-511 irqaffinity=0-127,256-383 idle=poll nosoftlockup nmi_watchdog=0 nowatchdog default_hugepagesz=1G hugepagesz=1G hugepages=512 mce=off numa_balancing=disable iommu=pt amd_iommu=on pcie_aspm=off skew_tick=1 tsc=reliable amd_pstate=disable split_lock_detect=ratelimit:1 rcupdate.rcu_normal_after_boot=1 initcall_blacklist=ahci_pci_driver_init,nvme_init,xhci_pci_init
}
