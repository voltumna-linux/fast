[Unit]
Requires=rtchain-prepare.service tango.slice
After=rtchain-prepare.service tango.slice

[Service]
Slice=tango.slice
Delegate=cpuset
# Permit the native child to apply the requested FIFO/RR priority. No capability
# is given to the Tango executable; controls' processes inherit these limits.
LimitRTPRIO=99
LimitMEMLOCK=infinity
ExecStart=
ExecStart=/usr/libexec/rtchain/tango-profile launch -- /usr/bin/Starter %l
