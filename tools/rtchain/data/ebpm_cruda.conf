-cruda_shm=/mnt/hugepages/cruda -cruda_shm_flags=hugepages
-app_id=2; -wipe=1; -heartbeat_hz=100
-tcbuf_base=sr/diagnostics/ebpm/tcbuf
-scalar=HorPos;  -field=X;    -type=f32
-scalar=VerPos;  -field=Y;    -type=f32
-scalar=Sum;     -field=Sum;  -type=f32
-scalar=Q;       -field=Q;    -type=f32
-scalar=Va;      -field=Va;   -type=f32
-scalar=Vb;      -field=Vb;   -type=f32
-scalar=Vc;      -field=Vc;   -type=f32
-scalar=Vd;      -field=Vd;   -type=f32
-scalar=HorPosPt; -field=X_pt;   -type=f32
-scalar=VerPosPt; -field=Y_pt;   -type=f32
-scalar=SumPt;    -field=Sum_pt; -type=f32
-scalar=QPt;      -field=Q_pt;   -type=f32
-scalar=VaPt;    -field=Va_pt; -type=f32
-scalar=VbPt;    -field=Vb_pt; -type=f32
-scalar=VcPt;    -field=Vc_pt; -type=f32
-scalar=VdPt;    -field=Vd_pt; -type=f32
-tcbuf=tbt;   -speed=tbt
-tcbuf=fb;    -speed=fb
-tcbuf=slow;  -speed=slow
-sg=sinx;  -plane=x;  -cos=sin
-sg=cosx;  -plane=x;  -cos=cos
-sg=siny;  -plane=y;  -cos=sin
-sg=cosy;  -plane=y;  -cos=cos
